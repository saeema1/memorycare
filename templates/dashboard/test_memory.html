{% extends 'base.html' %}
{% load static %}

{% block title %}Memory Test - MemoryCare{% endblock %}

{% block content %}
<div class="dashboard-header mb-8">
    <div style="display: flex; align-items: center; gap: 16px;">
        <a href="{% url 'dashboard:cognitive_tests' %}" class="btn btn-outline"><i class="fas fa-arrow-left"></i>
            Back</a>
        <h1 class="text-2xl font-bold">Memory Test</h1>
    </div>
</div>

<div class="card p-6 border shadow-sm" style="min-height: 300px; background: white;">
    <div id="game-setup" class="text-center py-5" style="display: block !important;">
        <h2 class="text-xl font-bold mb-4" style="color: #1f2937 !important;">Find the Matching Pairs</h2>
        <p class="mb-6" style="color: #4b5563 !important;">Click on cards to flip them. Find all pairs to win.</p>
        <button onclick="startGame()" class="btn btn-primary btn-lg px-5 rounded-pill shadow">Start Game</button>
    </div>

    <div id="game-board" class="grid grid-cols-4 gap-4" style="max-width: 600px; margin: 0 auto; display: none;">
        <!-- Cards generated by JS -->
    </div>

    <div id="game-over" class="text-center hidden" style="display: none;">
        <h2 class="text-xl font-bold text-green-600 mb-4"><i class="fas fa-check-circle"></i> Well Done!</h2>
        <p>You completed the test in <span id="final-time">0</span> seconds.</p>
        <button onclick="location.reload()" class="btn btn-secondary mt-4">Play Again</button>
    </div>
</div>

<script>
    const icons = ['fa-cat', 'fa-dog', 'fa-fish', 'fa-crow', 'fa-dragon', 'fa-dove'];
    let cards = [...icons, ...icons];
    let flipped = [];
    let matched = [];
    let startTime;

    function shuffle(array) {
        return array.sort(() => 0.5 - Math.random());
    }

    function startGame() {
        document.getElementById('game-setup').style.display = 'none';
        const board = document.getElementById('game-board');
        board.style.display = 'grid'; // enable grid
        board.classList.remove('hidden');

        cards = shuffle(cards);
        board.innerHTML = '';

        cards.forEach((icon, index) => {
            const card = document.createElement('div');
            card.className = 'card-flip bg-gray-200 h-24 rounded-lg flex items-center justify-center cursor-pointer text-3xl text-gray-200';
            card.dataset.icon = icon;
            card.dataset.index = index;
            card.onclick = () => flipCard(card);
            board.appendChild(card);
        });

        startTime = new Date();
    }

    function flipCard(card) {
        if (flipped.length >= 2 || flipped.includes(card) || matched.includes(card)) return;

        // Show icon
        card.classList.remove('bg-gray-200', 'text-gray-200');
        card.classList.add('bg-white', 'border-2', 'border-blue-500', 'text-blue-600');
        card.innerHTML = `<i class="fas ${card.dataset.icon}"></i>`;

        flipped.push(card);

        if (flipped.length === 2) {
            setTimeout(checkMatch, 800);
        }
    }

    function checkMatch() {
        const [c1, c2] = flipped;
        if (c1.dataset.icon === c2.dataset.icon) {
            matched.push(c1, c2);
            c1.classList.add('bg-green-100', 'border-green-500', 'text-green-600');
            c2.classList.add('bg-green-100', 'border-green-500', 'text-green-600');
            flipped = [];

            if (matched.length === cards.length) {
                endGame();
            }
        } else {
            // Reset
            c1.className = 'card-flip bg-gray-200 h-24 rounded-lg flex items-center justify-center cursor-pointer text-3xl text-gray-200';
            c1.innerHTML = '';
            c2.className = 'card-flip bg-gray-200 h-24 rounded-lg flex items-center justify-center cursor-pointer text-3xl text-gray-200';
            c2.innerHTML = '';
            flipped = [];
        }
    }

    function endGame() {
        const timeTaken = Math.round((new Date() - startTime) / 1000);
        document.getElementById('game-board').style.display = 'none';
        const over = document.getElementById('game-over');
        over.style.display = 'block';
        document.getElementById('final-time').innerText = timeTaken;

        // Save result
        fetch('{% url "dashboard:save_test_result" %}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({
                test_name: 'Memory Test',
                score: Math.max(0, 100 - timeTaken), // Simple score calc
                max_score: 100
            })
        });
    }
</script>

<style>
    .grid-cols-4 {
        grid-template-columns: repeat(4, 1fr);
    }

    .h-24 {
        height: 6rem;
    }

    .cursor-pointer {
        cursor: pointer;
    }

    /* Missing Utility Classes */
    .bg-gray-200 {
        background-color: #e5e7eb;
    }

    .text-gray-200 {
        color: #e5e7eb;
    }

    .bg-white {
        background-color: #ffffff;
    }

    .border-2 {
        border-width: 2px;
        border-style: solid;
    }

    .border-blue-500 {
        border-color: #3b82f6;
    }

    .text-blue-600 {
        color: #2563eb;
    }

    .bg-green-100 {
        background-color: #dcfce7;
    }

    .border-green-500 {
        border-color: #22c55e;
    }

    .text-green-600 {
        color: #166534;
    }

    .rounded-lg {
        border-radius: 0.5rem;
    }

    .gap-4 {
        gap: 1rem;
    }

    .flex {
        display: flex;
    }

    .items-center {
        align-items: center;
    }

    .justify-center {
        justify-content: center;
    }

    .hidden {
        display: none;
    }
</style>
{% endblock %}
