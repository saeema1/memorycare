{% extends 'base.html' %}

{% block title %}Edit Profile - MemoryCare{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1>Edit Profile</h1>
    </div>
    <div class="card" style="padding:1.5rem;">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn" type="submit">Save</button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
